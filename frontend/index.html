<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Manager MVP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Project Manager</h1>

        <div class="row">
            <!-- Projects Section -->
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5>Projects</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <input type="text" id="projectName" class="form-control" placeholder="New project name">
                        </div>
                        <button class="btn btn-primary" onclick="createProject()">Create Project</button>
                        <button class="btn btn-secondary" onclick="loadProjects()">Refresh List</button>

                        <div id="projectsList" class="mt-3"></div>
                    </div>
                </div>
            </div>

            <!-- Images Section -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Images</h5>
                    </div>
                    <div class="card-body">
                        <div id="currentProject" class="alert alert-info" style="display: none;"></div>

                        <div class="mb-3" id="uploadSection" style="display: none;">
                            <input type="file" id="imageUpload" class="form-control" multiple accept="image/*">
                            <button class="btn btn-success mt-2" onclick="uploadImages()">Upload Images</button>
                        </div>

                        <div id="imagesList" class="row mt-3"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal for Image View -->
        <div class="modal fade" id="imageModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Image Preview</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body text-center">
                        <img id="modalImage" src="" class="img-fluid" alt="">
                    </div>
                    <div class="modal-footer">
                        <a id="downloadLink" href="#" class="btn btn-primary" download>Download</a>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
